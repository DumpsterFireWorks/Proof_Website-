name: Build brand display assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-display-assets:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Build browser-safe display derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('public/brand/products')
          target = Path('public/brand/display')
          target.mkdir(parents=True, exist_ok=True)

          for path in sorted(source.glob('*.png')):
              image = Image.open(path).convert('RGBA')
              alpha = image.getchannel('A')
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f'No visible pixels in {path}')

              left, top, right, bottom = bbox
              pad = 48
              left = max(0, left - pad)
              top = max(0, top - pad)
              right = min(image.width, right + pad)
              bottom = min(image.height, bottom + pad)

              crop = image.crop((left, top, right, bottom))
              white = Image.new('RGBA', crop.size, (255, 255, 255, 255))
              white.alpha_composite(crop)
              out = target / path.name
              white.convert('RGB').save(out, 'PNG', optimize=True)
              print(f'{path.name}: {image.size} -> {white.size}')
          PY
      - name: Commit display derivatives when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/display
          if git diff --cached --quiet; then
            echo "Display assets already current."
            exit 0
          fi
          git commit -m "Add browser-safe Proof logo display derivatives"
          git push origin HEAD:${{ github.head_ref }}
