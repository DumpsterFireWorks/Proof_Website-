name: Owner asset fingerprint audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Fingerprint owner PNGs
        run: python scripts/identify-owner-assets.py
